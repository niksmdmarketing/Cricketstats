name: Daily records (Cricsheet)
on:
  schedule:
    - cron: "40 20 * * *"   # 6:40am Melbourne (AEST)
    - cron: "40 8 * * *"    # 6:40pm Melbourne
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: alerts, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore match data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: cricsheet-${{ github.run_id }}
          restore-keys: cricsheet-
      - name: Update data, detect records, send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m alerts.run daily
      - name: Save match data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: cricsheet-${{ github.run_id }}
      - name: Save state
        if: always()
        run: |
          git config user.name "cricket-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Update alert state"
          git pull --rebase -q && git push -q || true
