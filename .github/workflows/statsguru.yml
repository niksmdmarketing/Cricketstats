name: All-time career snapshot (Statsguru)
on:
  schedule:
    - cron: "15 18 * * 1"   # weekly, Tuesday 4:15am Melbourne
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['triggers/statsguru']
permissions:
  contents: write
concurrency: { group: alerts, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - shell: bash
        run: |
          mkdir -p state
          python -m alerts.statsguru 2>&1 | tail -c 20000 | tee state/last_statsguru.log
      - if: always()
        run: |
          git config user.name "cricket-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Update all-time career snapshot"
          git pull --rebase -q && git push -q || true
