name: Build history (no sending)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['triggers/build']
permissions:
  contents: write
concurrency: { group: alerts, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore match data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: cricsheet-${{ github.run_id }}
          restore-keys: cricsheet-
      - name: Restore history tables
        uses: actions/cache/restore@v4
        with:
          path: state/hist
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      - name: Update data and history
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p state
          python -m alerts.run build 2>&1 | tail -c 20000 | tee state/last_build.log
      - name: Save match data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: cricsheet-${{ github.run_id }}
      - name: Save history tables for the hourly job
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/hist
          key: hist-${{ github.run_id }}
      - name: Save state
        if: always()
        run: |
          git config user.name "cricket-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Update alert state"
          git pull --rebase -q && git push -q || true
