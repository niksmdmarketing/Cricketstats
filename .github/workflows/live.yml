name: Live milestones (ESPN feed)
on:
  schedule:
    - cron: "17 * * * *"    # every hour at :17
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['triggers/live']
permissions:
  contents: write
concurrency: { group: alerts, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Watch list + live check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m alerts.run live
      - name: Save state
        if: always()
        run: |
          git config user.name "cricket-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Update alert state"
          git pull --rebase -q && git push -q || true
